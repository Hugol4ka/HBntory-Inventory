services:

external-products-api:
    build: .
    container_name: hbntory-external-products-api
    environment:
      HBN_PRODUCTS_PORT: "5000"
      HBN_PRODUCTS_LATENCY_MS: "0"
    ports:
      - "5001:5000"
    restart: unless-stopped

db:
    container_name: hbntory-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: inventory
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

